[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hadith-misinfo-bench"
version = "0.1.0"
description = "Evidence-grounded cross-lingual Hadith misinformation verification and mitigation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HadithMisinfoBench Contributors" }]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
    "rank-bm25>=0.2.2",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "typing-extensions>=4.9",
]

[project.optional-dependencies]
# Dense retrieval — heavy; install separately when needed
dense = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

# LLM provider clients — install the one(s) you use
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
ollama = []  # uses httpx (already in core)

# All LLM clients at once
llm = ["openai>=1.30", "anthropic>=0.28"]

# Full install (everything)
all = [
    "hadith-misinfo-bench[dense]",
    "hadith-misinfo-bench[llm]",
]

# Development / testing
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "ipykernel>=6.0",
    "notebook>=7.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
inspect-mahaddat   = "hadith_misinfo._scripts.inspect_mahaddat:main"
inspect-hadith-json = "hadith_misinfo._scripts.inspect_hadith_json:main"
build-evidence     = "hadith_misinfo._scripts.build_evidence_index:main"
build-benchmark    = "hadith_misinfo._scripts.build_benchmark:main"
run-experiment     = "hadith_misinfo._scripts.run_experiment:main"
evaluate           = "hadith_misinfo._scripts.evaluate:main"
run-social-media   = "hadith_misinfo._scripts.run_social_media:main"
hmb-demo           = "hadith_misinfo._scripts.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
